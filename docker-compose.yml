# MoneyMesh — production stack: ./compose up --build
# Development stack: ./compose-dev up --build  (see docker-compose.dev.yml)
#
# App URLs (host machine):
#   Frontend:  http://localhost:25173
#   Backend:   http://localhost:23000/graphql
#   Postgres:  localhost:25432  (user: postgres / password: postgres / db: moneymesh)
#
# Database files live in ./data/postgres — copy that folder when moving to another device.
# This system uses Podman (not Docker). Compose file format is compatible with podman compose.

services:
  postgres:
    image: postgres:16-alpine
    container_name: moneymesh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-moneymesh}
    ports:
      - "${POSTGRES_HOST_PORT:-25432}:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-moneymesh}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: moneymesh-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BACKEND_HOST_PORT:-23000}:3000"
    environment:
      NODE_ENV: production
      SYSTEM_NODE_ENV: production
      SYSTEM_PORT: "3000"
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-moneymesh}?schema=public
      JWT_SECRET: ${JWT_SECRET:-local-compose-only-jwt-secret-min-32-chars}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-3600}
      BCRYPT_SALT_ROUNDS: ${BCRYPT_SALT_ROUNDS:-10}
      CORS_ORIGINS: http://localhost:${FRONTEND_HOST_PORT:-25173}

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      target: production
      args:
        VITE_GRAPHQL_ENDPOINT: http://localhost:${BACKEND_HOST_PORT:-23000}
    container_name: moneymesh-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_HOST_PORT:-25173}:80"
